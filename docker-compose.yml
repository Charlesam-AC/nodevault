# NodeVault. DB_HOST is the Compose service name `nodevault-db`
# (not the container_name). The API connects as nodevault_app, not the
# Postgres superuser.
version: "3.8"

services:
  nodevault-api:
    build: ./backend
    container_name: nodevault_api_core
    env_file: .env
    environment:
      DB_HOST: nodevault-db
      DB_PORT: "5432"
      DB_USER: nodevault_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      nodevault-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  nodevault-db:
    image: postgres:15-alpine
    container_name: nodevault_secure_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${DB_PUBLISH_PORT:-54329}:5432"
    volumes:
      - nodevault_postgres_data:/var/lib/postgresql/data
      - ./database/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
      - ./database/02-create-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/03-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  nodevault_postgres_data:
    name: nodevault_production_ledger_volume
